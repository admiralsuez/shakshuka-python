name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'shakshuka_companion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        working-directory: shakshuka_companion
        run: |
          # Read current version from pubspec.yaml
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "Current version: $CURRENT_VERSION"
          
          # Parse major and minor
          MAJOR=$(echo $CURRENT_VERSION | cut -d'.' -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d'.' -f2)
          
          # Increment minor, bump major if minor >= 10
          MINOR=$((MINOR + 1))
          if [ $MINOR -ge 10 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi
          
          # Calculate build number (total builds)
          BUILD_NUM=$((MAJOR * 10 + MINOR))
          
          NEW_VERSION="${MAJOR}.${MINOR}+${BUILD_NUM}"
          echo "New version: $NEW_VERSION"
          
          # Update pubspec.yaml
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          
          echo "VERSION=${MAJOR}.${MINOR}" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Clean build directory
        working-directory: shakshuka_companion
        run: flutter clean
        
      - name: Get dependencies
        working-directory: shakshuka_companion
        run: flutter pub get
        
      - name: Build APK
        working-directory: shakshuka_companion
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-apk
          path: shakshuka_companion/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-debug-symbols
          path: shakshuka_companion/build/debug-info/
          retention-days: 30
