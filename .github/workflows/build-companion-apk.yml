name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'shakshuka_companion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Clean build directory
        working-directory: shakshuka_companion
        run: flutter clean
        
      - name: Get dependencies
        working-directory: shakshuka_companion
        run: flutter pub get
        
      - name: Build APK
        working-directory: shakshuka_companion
        run: flutter build apk --release --split-debug-info=build/debug-info --obfuscate

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-apk
          path: shakshuka_companion/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-debug-symbols
          path: shakshuka_companion/build/debug-info/
          retention-days: 30
