name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'shakshuka_companion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        working-directory: shakshuka_companion
        run: |
          # Read current version from pubspec.yaml (format: X.Y.Z+build)
          CURRENT_VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "Current version: $CURRENT_VERSION"
          
          # Parse major, minor, patch
          MAJOR=$(echo $CURRENT_VERSION | cut -d'.' -f1)
          MINOR=$(echo $CURRENT_VERSION | cut -d'.' -f2)
          PATCH=$(echo $CURRENT_VERSION | cut -d'.' -f3)
          
          # Default patch to 0 if not present
          if [ -z "$PATCH" ]; then
            PATCH=0
          fi
          
          # Increment minor, bump major if minor >= 10
          MINOR=$((MINOR + 1))
          if [ $MINOR -ge 10 ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          fi
          
          # Calculate build number (total builds)
          BUILD_NUM=$((MAJOR * 10 + MINOR))
          
          # Flutter requires semver format: X.Y.Z+build
          NEW_VERSION="${MAJOR}.${MINOR}.0+${BUILD_NUM}"
          echo "New version: $NEW_VERSION"
          
          # Update pubspec.yaml
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          
          echo "VERSION=${MAJOR}.${MINOR}" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup signing key
        working-directory: shakshuka_companion/android
        run: |
          # Create keystore from secret or generate new one
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using existing keystore from secrets"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > shakshuka-release-key.jks
          else
            echo "Generating new keystore (first build)"
            keytool -genkey -v -keystore shakshuka-release-key.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias shakshuka -storepass shakshuka123 -keypass shakshuka123 \
              -dname "CN=Shakshuka, OU=Mobile, O=Shakshuka, L=Unknown, ST=Unknown, C=US"
            echo ""
            echo "⚠️  IMPORTANT: Add this keystore to GitHub secrets to ensure consistent signing!"
            echo "Run: base64 -w 0 shakshuka-release-key.jks"
            echo "Then add the output as ANDROID_KEYSTORE_BASE64 secret in your repo settings."
          fi
          
          # Create key.properties
          cat > key.properties << EOF
          storePassword=shakshuka123
          keyPassword=shakshuka123
          keyAlias=shakshuka
          storeFile=../shakshuka-release-key.jks
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Clean build directory
        working-directory: shakshuka_companion
        run: flutter clean
        
      - name: Get dependencies
        working-directory: shakshuka_companion
        run: flutter pub get
        
      - name: Build APK (split by ABI for smaller size)
        working-directory: shakshuka_companion
        run: |
          flutter build apk --release --split-per-abi || true
          # Verify APKs were built despite Flutter's false failure report
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            echo "✓ arm64-v8a APK built successfully"
            ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          else
            echo "✗ arm64-v8a APK not found"
            exit 1
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            echo "✓ armeabi-v7a APK built successfully"
            ls -lh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          else
            echo "✗ armeabi-v7a APK not found"
            exit 1
          fi

      - name: Upload APK (arm64-v8a - most devices)
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-arm64
          path: shakshuka_companion/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
          
      - name: Upload APK (armeabi-v7a - older devices)
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-arm32
          path: shakshuka_companion/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
          
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: shakshuka-companion-debug-symbols
          path: shakshuka_companion/build/debug-info/
          retention-days: 30

      - name: Upload keystore (save this as secret for future builds)
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-SAVE-AS-SECRET
          path: shakshuka_companion/android/shakshuka-release-key.jks
          retention-days: 7
          if-no-files-found: ignore
