name: shakshuka_companion
description: Shakshuka Companion - Companion app for Shakshuka Task Manager - add tasks on mobile, sync to PC
authors:
  - vibinandvanshika

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^5.1.1
  http: ^1.2.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  flutter_slidable: ^3.1.0
  intl: ^0.19.0
  # Add for better APK installation handling
  android_intent_plus: ^4.0.3
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
