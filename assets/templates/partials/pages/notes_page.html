            <!-- Notes Page -->
            <div id="notes-page" class="page">
                <div class="page-header">
                    <div class="notes-header-inner">
                        <h2>Notes</h2>
                        <div class="notes-header-actions">
                            <button class="btn-primary" id="notes-view-list-btn" title="View all notes">
                                View all notes
                            </button>
                            <button class="btn-primary btn-icon" id="notes-fullscreen-toggle-btn" title="Toggle fullscreen">
                                <i class="fas fa-expand"></i>
                            </button>
                            <button class="btn-primary" id="notes-split-toggle-btn" title="Toggle split view" style="display:none;">
                                Split view
                            </button>
                            <button class="btn-primary" id="notes-add-selection-task-btn" title="Make selected text a task">
                                Make selection a task
                            </button>
                        </div>
                    </div>
                </div>
                <div class="notes-container">
                    <div class="notes-dashboard-view" id="notes-dashboard-view">
                        <div class="notes-explorer" id="notes-explorer">
                            <div class="notes-folders-panel">
                                <div class="notes-folders-header">
                                    <h3>Folders</h3>
                                    <button type="button" class="btn-primary btn-icon" id="notes-add-folder-btn" title="Create folder">
                                        <i class="fas fa-folder-plus"></i>
                                    </button>
                                </div>
                                <ul class="notes-folder-list" id="notes-folder-list"></ul>
                            </div>
                            <div class="notes-explorer-main">
                                <div class="notes-explorer-header">
                                    <h3 id="notes-explorer-current-folder">All notes</h3>
                                    <div class="notes-explorer-controls task-controls-wrapper">
                                        <div class="task-search-wrapper" id="notes-search-wrapper">
                                            <input type="text" id="notes-explorer-filter" class="task-search-input" placeholder="Search notes..." autocomplete="off">
                                        </div>
                                        <select id="notes-explorer-sort" class="task-sort-select" title="Sort by">
                                            <option value="updated" selected>Last updated</option>
                                            <option value="title">Title AZ</option>
                                            <option value="created">Created date</option>
                                        </select>
                                        <button type="button" class="btn-primary btn-icon" id="notes-quick-add-btn" title="Quick add note">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                        <button type="button" class="btn-primary btn-icon" id="notes-export-all-btn" title="Export all notes as .zip">
                                            <i class="fas fa-download"></i>
                                        </button>
                                    </div>
                                </div>
                                <ul class="notes-explorer-notes" id="notes-explorer-notes"></ul>
                            </div>
                        </div>
                    </div>
                    <div class="notes-editor-view" id="notes-editor-view" style="display:none;">
                        <div class="notes-tabs-bar filter-tabs">
                            <div class="notes-tabs-scroll" id="notes-tabs"></div>
                            <button class="notes-tab notes-tab--new btn-primary btn-icon" id="notes-tab-new" type="button" title="New note tab">+</button>
                        </div>
                        <!-- Inline note search (quick-switch without leaving editor) -->
                        <div class="notes-editor-search" id="notes-editor-search" style="position:relative;margin-bottom:0.5rem;">
                            <div style="position:relative;">
                                <i class="fas fa-search" style="position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:0.8rem;pointer-events:none;"></i>
                                <input type="text" id="notes-editor-search-input" autocomplete="off" placeholder="Search all notes..."
                                    style="width:100%;padding:0.5rem 0.8rem 0.5rem 2.2rem;font-size:0.85rem;border-radius:12px;border:1px solid var(--border-color);background:var(--surface-color);color:var(--text-color);outline:none;transition:border-color 0.2s,box-shadow 0.2s;"
                                    onfocus="this.style.borderColor='var(--accent-color)';this.style.boxShadow='0 0 0 3px rgba(255,140,66,0.12)';"
                                    onblur="this.style.borderColor='var(--border-color)';this.style.boxShadow='none';">
                            </div>
                            <div id="notes-editor-search-results" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:200;max-height:220px;overflow-y:auto;background:var(--surface-color);border:1px solid var(--border-color);border-radius:10px;box-shadow:0 8px 24px var(--shadow-color);margin-top:4px;"></div>
                        </div>
                        <div class="notes-editors" id="notes-editors">
                            <textarea id="notes-editor-primary" class="notes-editor" spellcheck="false" placeholder="enter your thoughts here, you can use the buttons on top to view notes, split view and add selection to tasklist directly"></textarea>
                            <textarea id="notes-editor-secondary" class="notes-editor notes-editor--secondary" spellcheck="false"></textarea>
                        </div>
                    </div>
                </div>
            </div>
