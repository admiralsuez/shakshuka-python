    <!-- Planner Task History Modal -->
    <div class="modal" id="planner-history-modal">
        <div class="modal-content planner-history-modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-history"></i> Planner History</h3>
                <button class="modal-close" id="close-planner-history-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body planner-history-modal-body" id="planner-history-body">
                <div class="planner-history-controls">
                    <label for="planner-history-date" class="planner-history-label">Day</label>
                    <select id="planner-history-date" class="planner-history-select"></select>
                </div>
                <div id="planner-history-content" class="planner-history-content">
                    <div class="loading-changelog">
                        <div class="loading-spinner"></div>
                        <p>Loading history...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
