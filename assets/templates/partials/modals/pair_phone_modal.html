<div class="modal" id="pair-phone-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Pair Phone</h3>
            <div class="pair-download-links">
                <a href="https://github.com/admiralsuez/shakshuka-python/releases/latest" target="_blank" rel="noopener" title="Download from GitHub">
                    <i class="fas fa-code-branch"></i>
                </a>
                <a href="#" target="_blank" rel="noopener" title="Coming soon on Play Store" style="opacity:0.5;cursor:not-allowed;">
                    <i class="fas fa-store"></i>
                </a>
                <a href="#" target="_blank" rel="noopener" title="Coming soon on F-Droid" style="opacity:0.5;cursor:not-allowed;">
                    <i class="fas fa-robot"></i>
                </a>
            </div>
            <button class="modal-close" id="close-pair-phone-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body" style="text-align:center;">
            <!-- Pairing Section -->
            <div id="pairing-section">
                <div id="pair-phone-status" style="margin-bottom: 10px;">Loading…</div>
                <div id="pair-phone-code" style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin-bottom: 10px;"></div>
                <div id="pair-phone-qr" style="display:flex; justify-content:center; margin-bottom: 10px;"></div>
                <div id="pair-phone-url" style="word-break: break-all; margin-bottom: 16px;"></div>
                
                <!-- Web Companion URL for iPhone/other devices -->
                <div id="web-companion-section" style="background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-top: 16px;">
                    <div style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;">
                        <i class="fas fa-globe"></i> <strong>iPhone or no app?</strong> Open this in your phone's browser:
                    </div>
                    <div id="web-companion-url" style="background: var(--bg-color); padding: 12px; border-radius: 8px; font-family: monospace; font-size: 1rem; word-break: break-all; user-select: all; cursor: pointer;" onclick="copyCompanionUrl()" title="Click to copy">
                        Loading...
                    </div>
                    <div id="web-companion-qr" style="display:flex; justify-content:center; margin-top: 12px;"></div>
                    <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px;">
                        <i class="fas fa-info-circle"></i> Tap to copy or scan QR • Then add to Home Screen (iPhone: Share → Add to Home Screen)
                    </div>
                </div>
            </div>

            <div id="paired-devices-section" style="margin-top: 20px; text-align: left; display: none;">
                <h4 style="margin-bottom: 10px; color: var(--text-color);">
                    <i class="fas fa-mobile-alt"></i> Paired Devices
                </h4>
                <div id="paired-devices-list" style="max-height: 150px; overflow-y: auto;"></div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="pair-phone-refresh-btn">Refresh</button>
            <button type="button" class="btn-secondary" id="pair-phone-close-btn">Close</button>
        </div>
    </div>
</div>
