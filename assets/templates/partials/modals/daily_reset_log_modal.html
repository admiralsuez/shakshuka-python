<div class="modal" id="daily-reset-log-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Daily Reset Summary</h3>
            <button class="modal-close" id="close-daily-reset-log-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div id="daily-reset-log-subtitle" style="margin-bottom: 10px;"></div>
            <div class="daily-reset-log-list" id="daily-reset-log-list"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="daily-reset-log-close-btn">Close</button>
            <button type="button" class="btn-primary" id="daily-reset-log-dismiss-btn">Dismiss notifications</button>
        </div>
    </div>
</div>
