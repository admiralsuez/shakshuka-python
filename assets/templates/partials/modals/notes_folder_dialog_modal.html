    <!-- Notes Folder Dialog Modal -->
    <div class="modal" id="notes-folder-dialog-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="notes-folder-dialog-title">Folder</h3>
                <button class="modal-close" id="notes-folder-dialog-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="notes-folder-dialog-select">Existing folders</label>
                    <select id="notes-folder-dialog-select">
                        <!-- options populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="notes-folder-dialog-name">Folder name</label>
                    <input type="text" id="notes-folder-dialog-name" class="form-input" placeholder="Enter folder name">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="notes-folder-dialog-cancel">Cancel</button>
                <button type="button" class="btn-primary" id="notes-folder-dialog-apply">Apply</button>
            </div>
        </div>
    </div>
