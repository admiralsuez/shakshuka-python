

        <!-- Strike Modal -->
    <div id="strike-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Strike Task</h3>
                <button class="modal-close" id="close-strike-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="strike-form">
                    <div class="form-group">
                        <label for="strike-report">What did you accomplish?</label>
                        <textarea id="strike-report" placeholder="Describe what you completed or accomplished..." rows="4"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer strike-modal-footer">
                <!-- Row 1: Strike for Today and Strike Forever -->
                <div class="strike-button-row">
                    <button type="button" class="btn-warning" id="strike-today-btn">
                        <i class="fas fa-calendar-day"></i>
                        Strike for Today
                    </button>
                    <button type="button" class="btn-danger" id="strike-forever-btn">
                        <i class="fas fa-check-circle"></i>
                        Strike Forever
                    </button>
                </div>
                <!-- Row 2: Strike till and days input -->
                <div class="strike-button-row">
                    <button type="button" class="btn-success" id="strike-till-btn">
                        <i class="fas fa-hourglass-half"></i>
                        Strike till...
                    </button>
                    <div class="strike-till-control strike-till-days-control">
                        <label for="strike-till-days" class="sr-only">Strike for days</label>
                        <input type="number" id="strike-till-days" min="1" max="365" value="3" inputmode="numeric" aria-label="Number of days to strike task">
                        <span class="strike-till-days-text">days</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
