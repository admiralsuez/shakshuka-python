<!-- Daily Recap Modal -->
<div class="modal" id="daily-recap-modal">
    <div class="modal-content daily-recap-modal-content">
        <div class="modal-header daily-recap-header">
            <h3 id="daily-recap-title">Yesterday's Recap</h3>
            <button class="modal-close" id="close-daily-recap-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body daily-recap-modal-body">
            <div class="daily-recap-streak-banner" id="daily-recap-streak-banner">
                <span class="streak-label">Your streak</span>
                <span class="streak-value" id="daily-recap-streak-days">0 days</span>
            </div>
            <div class="daily-recap-stats-grid" id="daily-recap-grid"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="daily-recap-dismiss">Got it</button>
        </div>
    </div>
</div>
