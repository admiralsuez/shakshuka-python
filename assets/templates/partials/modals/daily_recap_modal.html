<!-- Daily Recap Modal -->
<div class="modal" id="daily-recap-modal">
    <div class="modal-content daily-recap-modal-content">
        <div class="modal-header daily-recap-header">
            <h3 id="daily-recap-title">Yesterday's Recap</h3>
            <button class="modal-close" id="close-daily-recap-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body daily-recap-modal-body">
            <div class="daily-recap-streak-banner" id="daily-recap-streak-banner">
                <span class="streak-label">Your streak</span>
                <span class="streak-value" id="daily-recap-streak-days">0 days</span>
            </div>
            <div class="daily-recap-stats-grid" id="daily-recap-grid"></div>
        </div>
        <div class="daily-recap-feedback" id="daily-recap-feedback">
            <h4 class="daily-recap-feedback-title">Quick Reflection</h4>
            <div class="daily-recap-feedback-field">
                <label for="recap-went-well">What went well today?</label>
                <textarea id="recap-went-well" data-key="went_well" rows="2" placeholder="Something that worked out..."></textarea>
            </div>
            <div class="daily-recap-feedback-field">
                <label for="recap-improve-tomorrow">What could be better tomorrow?</label>
                <textarea id="recap-improve-tomorrow" data-key="improve_tomorrow" rows="2" placeholder="One thing to improve..."></textarea>
            </div>
            <div class="daily-recap-feedback-field">
                <label for="recap-mood">Mood rating <span class="recap-mood-value" id="recap-mood-display">3</span>/5</label>
                <input type="range" id="recap-mood" data-key="mood_rating" min="1" max="5" step="1" value="3">
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="daily-recap-dismiss">Got it</button>
        </div>
    </div>
</div>
