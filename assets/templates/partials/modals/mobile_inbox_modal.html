<div class="modal" id="mobile-inbox-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Incoming Tasks</h3>
            <button class="modal-close" id="close-mobile-inbox-modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <div id="mobile-inbox-subtitle" style="margin-bottom: 10px;"></div>
            <div class="import-preview" id="mobile-inbox-list"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="mobile-inbox-reject-btn">Reject Selected</button>
            <button type="button" class="btn-outline" id="mobile-inbox-select-all-btn">Select All</button>
            <button type="button" class="btn-primary" id="mobile-inbox-approve-btn">Add Selected</button>
        </div>
    </div>
</div>
